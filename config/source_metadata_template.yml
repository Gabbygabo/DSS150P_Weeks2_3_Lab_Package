source_name: "orders"
source_type: "file"
location_or_endpoint: "data/orders.json"
owner: "placeholder - requires confirmation"
description: "Transactional orders with timestamps, status, item counts, amounts, and nested shipping details."
record_count: 250
schema:
  - { name: order_id, type: string, nullable: false }
  - { name: customer_id, type: string, nullable: false }
  - { name: order_timestamp, type: timestamp, nullable: false }
  - { name: status, type: string, nullable: false }
  - { name: item_count, type: integer, nullable: false }
  - { name: subtotal, type: numeric, nullable: false }
  - { name: shipping_fee, type: numeric, nullable: false }
  - { name: total_amount, type: numeric, nullable: false }
  - { name: shipping.region, type: string, nullable: false }
  - { name: shipping.method, type: string, nullable: false }
primary_or_candidate_key: "order_id"
update_pattern: "batch file"
known_quality_issues:
  - "Some orders cancelled or pending"
  - "Shipping method varies, may be inconsistent"
acquisition_method: "JSON ingestion via pipeline"
validation_checks:
  - "order_id must be unique"
  - "total_amount = subtotal + shipping_fee"
  - "status must be in {Pending, Packed, Shipped, Delivered, Cancelled, Paid}"


